# 테스트는 실제 MySQL 대신 인메모리 H2 사용 — 테스트의 deleteAll() 이 실데이터를 지우지 않도록
# (같은 classpath 위치에서는 .properties 가 application.yml 보다 우선)
spring.datasource.url=jdbc:h2:mem:sinabro_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.connection-init-sql=SELECT 1
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
